<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 17 Ultimate Calculator</title>
    <style>
        :root {
            --ios-bg: #000000;
            --ios-gray: #333333;
            --ios-light-gray: #a5a5a5;
            --ios-orange: #ff9f0a;
            --ios-blue: #0a84ff;
            --text: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; 
            /* 100dvh se mobile browser ka search bar problem nahi karega */
            height: 100dvh; width: 100%;
            background: var(--ios-bg); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            color: var(--text); overflow: hidden; 
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        /* --- iPhone Shell & Status Bar --- */
        .iphone-shell {
            max-width: 430px; margin: 0 auto; 
            height: 100dvh; /* Screen me fit */
            display: flex; flex-direction: column; position: relative;
        }
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px 0; font-size: 15px; font-weight: 600; z-index: 100;
        }
        .dynamic-island {
            width: 120px; height: 32px; background: #000; border-radius: 20px;
            position: absolute; left: 50%; transform: translateX(-50%); top: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: var(--ios-orange); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Screens --- */
        .screen { display: none; flex: 1; flex-direction: column; padding: 0 20px; animation: fade 0.3s; }
        .screen.active { display: flex; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        /* --- Main iOS Calculator --- */
        .display-area { 
            flex: 1; display: flex; flex-direction: column; 
            justify-content: flex-end; align-items: flex-end; 
            padding-bottom: 20px; cursor: ew-resize; /* Swipe indicator */
        }
        #history { font-size: 22px; color: #888; min-height: 28px; margin: 0; }
        #result { 
            font-size: 80px; font-weight: 300; margin: 0; 
            text-align: right; max-width: 100%; 
            overflow: hidden; letter-spacing: -2px; 
            transition: font-size 0.2s;
        }

        /* Keypad sizes fixed for smaller screens */
        .keypad { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 12px; padding-bottom: 30px; 
        }
        .btn {
            aspect-ratio: 1/1; border-radius: 50%; border: none; font-size: 32px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background-color 0.2s, filter 0.1s; 
            font-family: inherit; font-weight: 400;
        }
        .btn:active { filter: brightness(1.5); }
        .btn.num { background: var(--ios-gray); color: white; }
        .btn.op { background: var(--ios-orange); color: white; font-size: 38px;}
        .btn.top { background: var(--ios-light-gray); color: black; font-size: 28px; font-weight: 500;}
        .btn.zero { 
            grid-column: span 2; aspect-ratio: auto; 
            border-radius: 50px; justify-content: flex-start; padding-left: 28px; 
        }

        /* --- All Calculators Menu (iOS Action Sheet) --- */
        .menu-btn {
            position: absolute; top: 60px; left: 20px; font-size: 20px;
            background: var(--ios-gray); width: 36px; height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10;
        }
        
        .action-sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%; max-width: 430px; 
            margin: 0 auto; left: 50%; transform: translateX(-50%);
            background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(25px);
            border-top-left-radius: 30px; border-top-right-radius: 30px;
            padding: 20px 20px 40px; box-sizing: border-box; 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1); z-index: 1000;
        }
        .action-sheet.open { bottom: 0; }
        .sheet-handle { width: 40px; height: 5px; background: #666; border-radius: 5px; margin: 0 auto 20px; }
        
        .tools-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .tool-icon {
            background: var(--ios-gray); border-radius: 20px; padding: 15px 5px;
            text-align: center; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .tool-icon span { font-size: 28px; }

        /* --- Tool Screens UI --- */
        .tool-header { display: flex; align-items: center; padding: 60px 0 20px; font-size: 24px; font-weight: bold; }
        .back-btn { color: var(--ios-blue); font-size: 18px; margin-right: 15px; cursor: pointer; }
        .input-group { background: var(--ios-gray); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; }
        .ios-input { width: 100%; background: transparent; border: none; color: white; font-size: 24px; outline: none; box-sizing: border-box; }
        .ios-select { width: 100%; background: #444; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 16px; margin-top: 10px; }
        .ios-action-btn { background: var(--ios-blue); color: white; width: 100%; padding: 16px; border-radius: 14px; font-size: 18px; font-weight: 600; border: none; margin-top: 10px; cursor: pointer;}

        /* --- RK Vault --- */
        #rk-vault { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; padding: 50px 20px; overflow-y: auto; }
        .vault-card { background: #1c1c1e; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        .bseb-btn { background: #34c759; color: white; padding: 12px; border-radius: 10px; width: 100%; border: none; font-weight: bold; margin-bottom: 10px; font-size: 16px; cursor: pointer;}
        
    </style>
</head>
<body>

    <div class="iphone-shell">
        
        <div class="status-bar">
            <span id="clock">9:41</span>
            <div class="dynamic-island" id="island"></div>
            <span><svg width="25" height="12" viewBox="0 0 25 12" fill="white"><path d="M21 3H23C24.1 3 25 3.9 25 5V7C25 8.1 24.1 9 23 9H21V3ZM2 1H19C19.6 1 20 1.4 20 2V10C20 10.6 19.6 11 19 11H2C1.4 11 1 10.6 1 10V2C1 1.4 1.4 1 2 1ZM3 3V9H18V3H3Z"/></svg></span>
        </div>

        <div class="menu-btn" onclick="toggleMenu()">☰</div>

        <div id="calc-main" class="screen active">
            <div class="display-area" id="display-area">
                <p id="history"></p>
                <h1 id="result">0</h1>
            </div>
            
            <div class="keypad">
                <button class="btn top" onclick="clearAll()" id="clearBtn">AC</button>
                <button class="btn top" onclick="toggleSign()">+/-</button>
                <button class="btn top" onclick="ins('%')">%</button>
                <button class="btn op" onclick="ins('/')">÷</button>

                <button class="btn num" onclick="ins('7')">7</button>
                <button class="btn num" onclick="ins('8')">8</button>
                <button class="btn num" onclick="ins('9')">9</button>
                <button class="btn op" onclick="ins('*')">×</button>

                <button class="btn num" onclick="ins('4')">4</button>
                <button class="btn num" onclick="ins('5')">5</button>
                <button class="btn num" onclick="ins('6')">6</button>
                <button class="btn op" onclick="ins('-')">−</button>

                <button class="btn num" onclick="ins('1')">1</button>
                <button class="btn num" onclick="ins('2')">2</button>
                <button class="btn num" onclick="ins('3')">3</button>
                <button class="btn op" onclick="ins('+')">+</button>

                <button class="btn num zero" onclick="ins('0')">0</button>
                <button class="btn num" onclick="ins('.')">.</button>
                <button class="btn op" onclick="calculate()">=</button>
            </div>
        </div>

        <div id="calc-bmi" class="screen">
            <div class="tool-header"><span class="back-btn" onclick="openScreen('calc-main')">❮ Back</span> BMI Calc</div>
            <div class="input-group">
                <label>Weight (kg)</label>
                <input type="number" id="bmi-w" class="ios-input" placeholder="e.g. 70">
            </div>
            <div class="input-group">
                <label>Height (cm)</label>
                <input type="number" id="bmi-h" class="ios-input" placeholder="e.g. 175">
            </div>
            <button class="ios-action-btn" onclick="calcBMI()">Calculate</button>
            <h2 id="bmi-res" style="text-align:center; color: var(--ios-orange); margin-top: 30px;"></h2>
        </div>

        <div id="calc-age" class="screen">
            <div class="tool-header"><span class="back-btn" onclick="openScreen('calc-main')">❮ Back</span> Age Calc</div>
            <div class="input-group">
                <label>Date of Birth</label>
                <input type="date" id="age-dob" class="ios-input" style="font-size: 18px;">
            </div>
            <button class="ios-action-btn" onclick="calcAge()">Find Age</button>
            <h2 id="age-res" style="text-align:center; color: var(--ios-blue); margin-top: 30px;"></h2>
        </div>

        <div id="calc-conv" class="screen">
            <div class="tool-header"><span class="back-btn" onclick="openScreen('calc-main')">❮ Back</span> Converter</div>
            <div class="input-group">
                <label>Amount / Value</label>
                <input type="number" id="conv-val" class="ios-input" placeholder="0" oninput="runConv()">
                <select id="conv-type" class="ios-select" onchange="runConv()">
                    <option value="usd-inr">🇺🇸 USD to 🇮🇳 INR</option>
                    <option value="inr-usd">🇮🇳 INR to 🇺🇸 USD</option>
                    <option value="kg-lb">⚖️ KG to Lbs</option>
                    <option value="m-ft">📏 Meters to Feet</option>
                </select>
            </div>
            <div class="input-group">
                <label>Result</label>
                <h1 id="conv-res" style="margin: 0; color: #34c759;">0.00</h1>
            </div>
        </div>

        <div id="action-sheet" class="action-sheet">
            <div class="sheet-handle" onclick="toggleMenu()"></div>
            <h3 style="margin-top: 0; margin-bottom: 20px;">All Calculators</h3>
            <div class="tools-grid">
                <div class="tool-icon" onclick="openScreen('calc-main')"><span>🔢</span> Standard</div>
                <div class="tool-icon" onclick="openScreen('calc-bmi')"><span>⚖️</span> BMI</div>
                <div class="tool-icon" onclick="openScreen('calc-age')"><span>🎂</span> Age</div>
                <div class="tool-icon" onclick="openScreen('calc-conv')"><span>💱</span> Currency</div>
                <div class="tool-icon" onclick="openScreen('calc-conv')"><span>📏</span> Units</div>
                <div class="tool-icon" onclick="toggleMenu(); notify('Scientific Auto-Rotates in Pro')"><span>📐</span> Scientific</div>
            </div>
        </div>

        <div id="rk-vault">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1 style="margin: 0; color: var(--ios-orange);">RK Cloud Vault</h1>
                <span style="color: var(--ios-blue); font-weight: bold; font-size: 18px; cursor: pointer;" onclick="closeVault()">Lock</span>
            </div>

            <div class="vault-card">
                <h3 style="margin-top:0; color:#aaa;">🎓 BSEB Portal</h3>
                <button class="bseb-btn">Class 10 Science Quiz (Hindi)</button>
                <button class="bseb-btn" style="background: #0a84ff;">Sanskrit Grammar PDF</button>
            </div>

            <div class="vault-card" style="text-align: center;">
                <h3 style="margin-top:0; color:#aaa;">💳 Checkout Test</h3>
                <div style="font-size: 30px; margin-bottom: 15px;">₹ <span id="v-amt">0.00</span></div>
                <div style="display: flex; justify-content: space-around; background: #000; padding: 10px; border-radius: 12px;">
                    <span style="color: white; font-weight: bold;">GPay</span>
                    <span style="color: #5e35b1; font-weight: bold;">PhonePe</span>
                </div>
            </div>

            <div class="vault-card">
                <h3 style="margin-top:0; color:#aaa;">📝 Secret Notes</h3>
                <input type="text" class="ios-input" style="font-size:16px; border-bottom:1px solid #444; margin-bottom:10px;" placeholder="Title">
                <textarea class="ios-input" style="font-size:16px; height: 60px; border-bottom:1px solid #444;" placeholder="Type a secret note..."></textarea>
                <button class="ios-action-btn" style="background: var(--ios-orange); color: black;">Save to RK Cloud</button>
            </div>
        </div>
    </div>

    <script>
        // Clock Logic
        setInterval(() => {
            let d = new Date();
            document.getElementById('clock').innerText = d.getHours() + ":" + d.getMinutes().toString().padStart(2, '0');
        }, 1000);

        // Core Calc Logic
        let exp = "";
        const PASS = "8298";
        const display = document.getElementById('result');
        const clearBtn = document.getElementById('clearBtn');
        
        function updateDisplay() {
            display.innerText = exp || "0";
            
            // Smart AC / C Button Logic
            clearBtn.innerText = exp.length > 0 ? "C" : "AC";

            // Auto resize text like real iOS
            let len = display.innerText.length;
            if(len > 12) display.style.fontSize = "35px";
            else if(len > 9) display.style.fontSize = "45px";
            else if(len > 6) display.style.fontSize = "60px";
            else display.style.fontSize = "80px";
        }

        function ins(v) { 
            exp += v; 
            updateDisplay(); 
        }
        
        function clearAll() { 
            exp = ""; 
            updateDisplay(); 
            document.getElementById('history').innerText = ""; 
        }

        // New Swipe to Delete (Backspace) Logic
        function backspace() { 
            if(exp.length > 0) {
                exp = exp.slice(0, -1); 
                updateDisplay(); 
            }
        }

        // Real iOS Swipe Gesture Support
        let startX = 0;
        const displayArea = document.getElementById('display-area');
        
        displayArea.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });
        
        displayArea.addEventListener('touchend', (e) => {
            let endX = e.changedTouches[0].clientX;
            // Agar 40px se zyada left ya right swipe kiya toh delete hoga
            if (Math.abs(endX - startX) > 40) {
                backspace();
            }
        });

        // Fixed Plus/Minus Button Logic
        function toggleSign() {
            if (exp) {
                if (exp.startsWith('-')) {
                    exp = exp.substring(1); // Remove minus
                } else {
                    exp = '-' + exp; // Add minus
                }
                updateDisplay();
            }
        }

        function calculate() {
            if(exp === PASS) {
                document.getElementById('rk-vault').style.display = 'block';
                document.getElementById('v-amt').innerText = "1500.00"; // Dummy test amount
                clearAll(); 
                notify("RK Vault Unlocked");
                return;
            }
            try {
                // Prevent empty evaluation
                if(!exp) return; 
                
                document.getElementById('history').innerText = exp + " =";
                exp = eval(exp).toString();
                
                // Fix long decimals length
                if(exp.includes('.') && exp.split('.')[1].length > 5) {
                    exp = parseFloat(exp).toFixed(5).toString();
                    // Remove trailing zeros
                    exp = parseFloat(exp).toString(); 
                }
                updateDisplay();
            } catch {
                exp = "Error"; 
                updateDisplay(); 
                setTimeout(clearAll, 1500);
            }
        }

        // Navigation & Menu
        function toggleMenu() { document.getElementById('action-sheet').classList.toggle('open'); }
        
        function openScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('action-sheet').classList.remove('open');
            notify(id.replace('calc-', '').toUpperCase() + " Mode");
        }

        function notify(msg) {
            const island = document.getElementById('island');
            island.innerText = msg;
            island.style.width = "200px";
            setTimeout(() => { island.innerText = ""; island.style.width = "120px"; }, 2000);
        }

        // Tools Logic
        function calcBMI() {
            let w = document.getElementById('bmi-w').value;
            let h = document.getElementById('bmi-h').value / 100;
            if(!w || !h) return;
            let bmi = (w / (h * h)).toFixed(1);
            let status = bmi < 18.5 ? "Underweight" : (bmi < 25 ? "Normal" : "Overweight");
            document.getElementById('bmi-res').innerText = bmi + " (" + status + ")";
        }

        function calcAge() {
            let dob = new Date(document.getElementById('age-dob').value);
            if(isNaN(dob)) return;
            let diff = new Date() - dob;
            let age = Math.floor(diff / 31557600000); // ms to years
            document.getElementById('age-res').innerText = age + " Years Old";
        }

        function runConv() {
            let val = document.getElementById('conv-val').value;
            let type = document.getElementById('conv-type').value;
            let res = 0;
            if(!val) { document.getElementById('conv-res').innerText = "0.00"; return; }
            
            if(type === 'usd-inr') res = "₹ " + (val * 83).toFixed(2);
            if(type === 'inr-usd') res = "$ " + (val / 83).toFixed(2);
            if(type === 'kg-lb') res = (val * 2.204).toFixed(2) + " Lbs";
            if(type === 'm-ft') res = (val * 3.280).toFixed(2) + " Ft";
            
            document.getElementById('conv-res').innerText = res;
        }

        // Vault
        function closeVault() { 
            document.getElementById('rk-vault').style.display = 'none'; 
            notify("Vault Locked"); 
        }
    </script>
</body>
</html>
